[package]
name = "hring"
version = "0.2.0"
authors = ["Xhelgi <helgi@proton.me>"]
edition = "2024"

[features]
default = ["cpu"]
# CPU rasterizer (`egui_software_backend`) + `wl_shm` presentation. Fast startup.
cpu = ["dep:egui_software_backend", "dep:bytemuck"]
# GPU presentation (`wgpu` + `egui-wgpu`) on the same layer-shell surface.
gpu = ["dep:egui-wgpu", "dep:pollster", "dep:wayland-backend"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9.8"
bincode = { version = "2.0.1"}
homedir = "0.3.6"
egui = { version = "0.33", features = ["default_fonts"] }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
calloop = "0.14"
calloop-wayland-source = "0.4"
freedesktop_entry_parser = "2.0.1"
# CPU backend.
egui_software_backend = { version = "0.0.2", default-features = false, features = ["std", "rayon"], optional = true }
bytemuck = { version = "1", optional = true }
# GPU backend.
egui-wgpu = { version = "0.33", optional = true }
pollster = { version = "0.4", optional = true }
wayland-backend = { version = "0.3", features = ["client_system"], optional = true }
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "webp",
] }
resvg = { version = "0.45", default-features = false, features = ["raster-images"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true