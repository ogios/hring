[package]
name = "hring"
version = "0.2.0"
authors = ["Xhelgi <helgi@proton.me>"]
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9.8"
bincode = { version = "2.0.1" }
homedir = "0.3.6"
egui = { version = "0.33", features = ["default_fonts"] }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
calloop = "0.14"
calloop-wayland-source = "0.4"
freedesktop_entry_parser = "2.0.1"
egui-wgpu = "0.33"
pollster = "0.4"
wayland-backend = { version = "0.3", features = ["client_system"] }
image = { version = "0.25", default-features = false, features = [
  "bmp",
  "gif",
  "ico",
  "jpeg",
  "png",
  "webp",
] }
resvg = { version = "0.45", default-features = false, features = [
  "raster-images",
] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
